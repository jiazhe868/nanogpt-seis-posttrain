# nanoGPT-Seis Stage 3 — GRPO v8 (2026-10-16, audit §15.11): the v5 recipe (μ=2, clip 0.2/0.28,
# TIS) on the program-of-thought student (configs/sft_pot_v2.yaml). Rollouts run with pot=True:
# the decoder executes each program at </think> and writes "Answer: <value>"; those tokens are
# masked from the loss, so the reward credits the program. Prompts: the real RL pool (v2 labels)
# plus exact-label real-style rewrites, re-instantiated real questions and teacher exercises.
model:
  base_checkpoint: checkpoints/sft_pot_v2/sft_ckpt_epoch4.pt
grpo:
  group_size: 8
  prompts_per_step: 16
  micro_batch_rows: 8                # real-style rewrites are long: 16 rows ran out of memory at step 134
  stratify_types: true
  learning_rate: 5.0e-06
  warmup_steps: 10
  grad_clip: 1.0
  adv_norm: batch
  loss_agg: constant
  kl_loss: k2
  kl_controller: fixed
  kl_coeff: 0.04
  kl_target: 0.05
  kl_stop: 0.5
  max_new_tokens: 384
  temperature: 1.0
  top_p: 1.0
  max_steps: 150
  seed: 42
  eval_every: 10
  eval_prompts: 275
  eval_samples: 2
  eval_batch_prompts: 64
  num_iterations: 2
  epsilon: 0.2
  epsilon_high: 0.28
  tis_cap: 2.0
  calculator: false
  pot: true
data:
  train_file: data/rl/train_pot_mix2.jsonl
  val_file: data/rl/val.jsonl
save:
  output_dir: checkpoints/grpo_v8_pot
  save_every: 25
  log_file: checkpoints/runs/grpo_v8_pot.csv
