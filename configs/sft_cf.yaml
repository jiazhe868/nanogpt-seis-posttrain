# Counterfactual SFT (2026-10-15, audit §15.9): real training questions re-instantiated with new
# numbers (src.sft.counterfactual, 4,964 variants: the answer can only be computed from the
# question, not recalled) + all 3,705 numerical pairs in calculator format with an answer-first
# final answer ("Answer: <derivation result>.") + 3,705 replayed other pairs. Decode with
# calculator=True (src.rl.rollout).
model:
  vocab_size: 16388
  block_size: 4096
  n_layer: 16
  n_head: 12
  n_kv_head: 4
  d_model: 768
  ffn_multiple_of: 256
  rope_theta: 10000.0
  dropout: 0.0

train:
  ckpt_path: "checkpoints/sft/selected.pt"
  tokenizer_path: "../nanogpt_seis/data/tokenized/tokenizer.json"
  train_path: "data/splits/train_cf_mix.jsonl"      # 4,964 counterfactual + 3,705 numerical + 3,705 replay
  val_path: "data/splits/val.jsonl"                   # original val: watches for forgetting
  out_dir: "checkpoints/sft_cf"
  epochs: 4
  batch_size: 4
  grad_accum: 4
  learning_rate: 1.0e-4                               # continued training: half the SFT peak
  min_lr: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_seq_len: 4096
  pack_sequences: true
  seed: 42
