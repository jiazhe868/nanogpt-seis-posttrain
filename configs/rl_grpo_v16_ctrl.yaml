# nanoGPT-Seis Stage 3 — GRPO v16 (ctrl arm), reward_mode: correctness (README §5.19, audit §15.23).
# Does a denser reward help? Both arms share the start (the deployed v14 checkpoint), the pool
# (data/rl/train_v16_pool.jsonl: corpus exercises and stepping stones the deployed model solves 0-7 of 8,
# including the 2,765 it never solves), 120 steps (~2 visits) and the seed; only reward_mode differs.
# "step" adds 0.3 x F1 between the program's intermediate values and the teacher's (train_grpo.step_reward).
model:
  base_checkpoint: checkpoints/grpo_v14_corpus/grpo_ckpt_step_75.pt
grpo:
  group_size: 8
  prompts_per_step: 32
  micro_batch_rows: 8
  stratify_types: false
  learning_rate: 5.0e-06
  warmup_steps: 10
  grad_clip: 1.0
  adv_norm: batch
  loss_agg: constant
  kl_loss: k2
  kl_controller: fixed
  kl_coeff: 0.02
  kl_target: 0.05
  kl_stop: 0.5
  max_new_tokens: 384
  temperature: 0.8
  top_p: 1.0
  max_steps: 120
  seed: 42
  eval_every: 25
  eval_prompts: 700
  eval_samples: 2
  eval_batch_prompts: 32
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  tis_cap: 2.0
  calculator: false
  pot: true
  pot_notation: true
  reward_mode: correctness
data:
  train_file: data/rl/train_v16_pool.jsonl
  val_file: data/rl/v13_dev.jsonl
save:
  output_dir: checkpoints/grpo_v16_ctrl
  save_every: 20
  log_file: checkpoints/runs/grpo_v16_ctrl.csv
