# nanoGPT-Seis Stage 3 — GRPO v5: the v4 objective with rollout reuse.
#
# Generation was 82% of a v4 step (MFU 0.6% during decoding), so each rollout batch now gets
# num_iterations=2 optimizer updates (TRL `num_iterations`), with the PPO ratio clipped to
# [1 - epsilon, 1 + epsilon_high] (DAPO clip-higher, 0.28), and tokens weighted by
# min(p_train / p_sampler, tis_cap) to correct the bf16 sampler/trainer mismatch (TRL TIS).
# 150 rollout batches x 2 = the same 300 updates as v4. Labels: corrected (PITFALLS C3).

model:
  base_checkpoint: checkpoints/sft/selected.pt
grpo:
  group_size: 8
  prompts_per_step: 16
  micro_batch_rows: 16
  stratify_types: true
  learning_rate: 5.0e-06
  warmup_steps: 10
  grad_clip: 1.0
  adv_norm: batch
  loss_agg: constant
  kl_loss: k2
  kl_controller: fixed
  kl_coeff: 0.04
  kl_target: 0.05
  kl_stop: 0.5
  max_new_tokens: 384
  temperature: 1.0
  top_p: 1.0
  max_steps: 150
  seed: 42
  eval_every: 10
  eval_prompts: 275
  eval_samples: 2
  eval_batch_prompts: 64
  num_iterations: 2
  epsilon: 0.2
  epsilon_high: 0.28
  tis_cap: 2.0
data:
  train_file: data/rl/train.jsonl
  val_file: data/rl/val.jsonl
save:
  output_dir: checkpoints/grpo_v5
  save_every: 25
  log_file: checkpoints/runs/grpo_v5.csv
