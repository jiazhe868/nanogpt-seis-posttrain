# Continued SFT on calculator-format computation drills (tools/numeric_drills.py) mixed 1:1 with
# replayed original SFT pairs, starting from the deployed SFT checkpoint. The drills teach formula
# recall and value binding; arithmetic is written as <<expr>> for the decoder's calculator
# (src.rl.rollout, calculator=True). Select on behaviour, not val loss (PITFALLS E1).
model:
  vocab_size: 16388
  block_size: 4096
  n_layer: 16
  n_head: 12
  n_kv_head: 4
  d_model: 768
  ffn_multiple_of: 256
  rope_theta: 10000.0
  dropout: 0.0

train:
  ckpt_path: "checkpoints/sft/selected.pt"
  tokenizer_path: "../nanogpt_seis/data/tokenized/tokenizer.json"
  train_path: "data/splits/train_drills_mix.jsonl"   # 6,000 drills + 6,000 replayed SFT pairs
  val_path: "data/splits/val.jsonl"                   # original val: watches for forgetting
  out_dir: "checkpoints/sft_drills"
  epochs: 2
  batch_size: 4
  grad_accum: 4
  learning_rate: 5.0e-5                               # continued training: half the SFT sweep optimum
  min_lr: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_seq_len: 4096
  pack_sequences: true
  seed: 42
