# What `python -m src.sft.chat` serves when no --ckpt-path is given (README §1.2 / §5.19).
#
# The paper-notation program-of-thought student after GRPO on the corpus pool (v14, dev-selected step 75):
# inside <think> it writes its working as short equations (`M0 = μ·A·D [N m]`), src/rl/pot.py executes them
# at </think>, and the decoder writes `Answer: <value>`; the model then adds the unit. Eight samples are drawn
# and the answer most of them agree on is returned.
#
# Measured on the 153 real held-out numerical questions (6 seeds × 4, docs/eval_numerical_real6_final.json):
# acc@5% 22.0% for one sample, 23.3% with vote@8 (within 1%: 20.5%; questions that need computation: 21.6%).
# The previous default, the Phase IV student without GRPO (checkpoints/sft_pot_notation2/sft_ckpt_epoch4.pt),
# scores 19.7% / 22.2% (within 1%: 18.1%; need computation: 22.4%).
checkpoint: checkpoints/grpo_v14_corpus/grpo_ckpt_step_75.pt
decoder:
  format: pot_notation       # executed paper-notation equations (src.rl.rollout.generate(pot=True, pot_notation=True))
  temperature: 0.3
  top_k: 40
  repetition_penalty: 1.0    # programs reuse symbol names; a penalty turns working into crashes (§5.18)
  vote: 8                    # self-consistency over the executed answers (src.rl.self_consistency)
  max_new_tokens: 512
