# Paper-notation SFT, data-recovery round (2026-10-17, audit §15.15): sft_pot_notation's mixture rebuilt
# after re-prompting the ~18k rewrites the verification filter rejected (bad format / symbols longer than
# 8 characters) with an explicit reminder of the violated rules.
model:
  vocab_size: 16388
  block_size: 4096
  n_layer: 16
  n_head: 12
  n_kv_head: 4
  d_model: 768
  ffn_multiple_of: 256
  rope_theta: 10000.0
  dropout: 0.0

train:
  ckpt_path: "checkpoints/sft/selected.pt"
  tokenizer_path: "../nanogpt_seis/data/tokenized/tokenizer.json"
  train_path: "data/splits/train_pot_notation2.jsonl"
  val_path: "data/splits/val.jsonl"                   # original val: watches for forgetting
  out_dir: "checkpoints/sft_pot_notation2"
  epochs: 4
  batch_size: 4
  grad_accum: 4
  learning_rate: 1.0e-4                               # continued training: half the SFT peak
  min_lr: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_seq_len: 4096
  pack_sequences: true
  seed: 42
