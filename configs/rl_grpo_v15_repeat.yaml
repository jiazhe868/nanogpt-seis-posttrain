# nanoGPT-Seis Stage 3 — GRPO v15, REPEATED practice on the corpus problems (README §5.19, audit §15.20).
# v14 practised ~10k problems once each and gained +2.4 pp held out; the transfer study practised 576 problems
# ~8 times each and lifted them 49% -> 85%. This run starts from the deployed v14 checkpoint and practises only
# the problems written from the held-out papers' excerpts (tools/gen_chunk_problems.py exercises + their
# stepping stones; never the test questions), re-filtered to those the deployed model solves 1-7 of 8,
# about 8 visits each (max_steps set by scripts/experiments/v15_chain.sh). Corpus protocol, dev-selected.
model:
  base_checkpoint: checkpoints/grpo_v14_corpus/grpo_ckpt_step_75.pt
grpo:
  group_size: 8
  prompts_per_step: 32
  micro_batch_rows: 8
  stratify_types: false
  learning_rate: 5.0e-06
  warmup_steps: 10
  grad_clip: 1.0
  adv_norm: batch
  loss_agg: constant
  kl_loss: k2
  kl_controller: fixed
  kl_coeff: 0.02
  kl_target: 0.05
  kl_stop: 0.5
  max_new_tokens: 384
  temperature: 0.8
  top_p: 1.0
  max_steps: 135
  seed: 42
  eval_every: 25
  eval_prompts: 700
  eval_samples: 2
  eval_batch_prompts: 32
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  tis_cap: 2.0
  calculator: false
  pot: true
  pot_notation: true
  reward_mode: correctness
data:
  train_file: data/rl/train_v15_repeat.jsonl
  val_file: data/rl/v13_dev.jsonl
save:
  output_dir: checkpoints/grpo_v15_repeat
  save_every: 25
  log_file: checkpoints/runs/grpo_v15_repeat.csv
