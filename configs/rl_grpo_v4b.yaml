# Control for v5: the v4 algorithm (one update per rollout batch, no ratio, no TIS) on the
# corrected labels and the CUDA-graph rollout engine, 300 updates. v5 vs v4b isolates rollout reuse.

model:
  base_checkpoint: checkpoints/sft/selected.pt
grpo:
  group_size: 8
  prompts_per_step: 16
  micro_batch_rows: 16
  stratify_types: true
  learning_rate: 5.0e-06
  warmup_steps: 10
  grad_clip: 1.0
  adv_norm: batch
  loss_agg: constant
  kl_loss: k2
  kl_controller: fixed
  kl_coeff: 0.04
  kl_target: 0.05
  kl_stop: 0.5
  max_new_tokens: 384
  temperature: 1.0
  top_p: 1.0
  max_steps: 300
  seed: 42
  eval_every: 10
  eval_prompts: 275
  eval_samples: 2
  eval_batch_prompts: 64
data:
  train_file: data/rl/train.jsonl
  val_file: data/rl/val.jsonl
save:
  output_dir: checkpoints/grpo_v4b
  save_every: 50
  log_file: checkpoints/runs/grpo_v4b.csv
