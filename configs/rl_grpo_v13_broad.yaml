# nanoGPT-Seis Stage 3 — GRPO v13, broad pool + stepping stones (2026-10-17, audit §15.18, README §5.19).
# The transfer study found that GRPO's gains travel by similarity to the practised problems and that a
# never-solved problem gives no gradient. So this run trains on a broad pool of problems the student has
# never seen (tools/build_rl_pool.py: unseen teacher problems from SFT-train seeds, deduplicated against the
# SFT data, at most 2 per template), plus first-step versions of never-solved ones
# (tools/gen_stepping_stones.py), in ONE pass: max_steps = pool / (32 prompts x 2 GPUs), set by the chain.
# Checkpoint chosen on a dev set (val dev split + B600) before the test set is touched.
model:
  base_checkpoint: checkpoints/sft_pot_notation2/sft_ckpt_epoch4.pt
grpo:
  group_size: 8
  prompts_per_step: 32
  micro_batch_rows: 8
  stratify_types: false
  learning_rate: 5.0e-06
  warmup_steps: 10
  grad_clip: 1.0
  adv_norm: batch
  loss_agg: constant
  kl_loss: k2
  kl_controller: fixed
  kl_coeff: 0.02
  kl_target: 0.05
  kl_stop: 0.5
  max_new_tokens: 384
  temperature: 0.8
  top_p: 1.0
  max_steps: 150
  seed: 42
  eval_every: 25
  eval_prompts: 700
  eval_samples: 2
  eval_batch_prompts: 32
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  tis_cap: 2.0
  calculator: false
  pot: true
  pot_notation: true
  reward_mode: correctness
data:
  train_file: data/rl/train_v13_broad.jsonl
  val_file: data/rl/v13_dev.jsonl
save:
  output_dir: checkpoints/grpo_v13_broad
  save_every: 25
  log_file: checkpoints/runs/grpo_v13_broad.csv
